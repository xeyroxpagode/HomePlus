// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    def kotlinVersion = findProperty('android.kotlinVersion')
    classpath(kotlinVersion ? "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion" : 'org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// Windows' native toolchain also builds C++ inside dependency projects.
// Keep their generated files in this workspace, with bounded object paths.
if (System.getProperty("os.name").toLowerCase().contains("windows")) {
  subprojects { nativeProject ->
    nativeProject.afterEvaluate {
      def androidExtension = nativeProject.extensions.findByName("android")
      if (androidExtension != null) {
        androidExtension.externalNativeBuild.cmake.buildStagingDirectory = rootProject.file("../../../.native-build/${nativeProject.name}")
        androidExtension.defaultConfig.externalNativeBuild.cmake.arguments "-DCMAKE_OBJECT_PATH_MAX=250"
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
