appId: com.anonymous.homeplus
---
# Fixture: QA bootstrap guarantees one visible pending Planner task.
# This flow creates its own card so the full suite does not depend on flow order.
- runFlow:
    file: ../shared/ensure-authenticated.yaml
- extendedWaitUntil:
    visible:
      id: nav.messages
    timeout: 15000
- tapOn:
    id: nav.messages
- tapOn:
    id: messages.conversation.household
- extendedWaitUntil:
    visible:
      id: screen.messages.conversation
    timeout: 15000
- tapOn:
    id: messages.action.add
- tapOn:
    id: messages.action.tarea
- extendedWaitUntil:
    visible:
      id: messages.taskPicker
    timeout: 15000
- tapOn:
    id: messages.taskPicker.firstTask
- extendedWaitUntil:
    visible:
      id: messages.taskCard
    timeout: 15000
- tapOn:
    id: messages.taskCard.open
- extendedWaitUntil:
    visible:
      id: screen.planner.taskDetail
    timeout: 15000
- tapOn:
    text: Volver
- extendedWaitUntil:
    visible:
      id: screen.messages.conversation
    timeout: 15000
