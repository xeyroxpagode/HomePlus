appId: com.anonymous.homeplus
---
- runFlow:
    file: ../shared/ensure-signed-out.yaml
- runFlow:
    file: ../shared/login.yaml
    env:
      QA_EMAIL: ${QA_A_EMAIL}
      QA_PASSWORD: ${QA_A_PASSWORD}
- tapOn:
    id: account.menu.open
- extendedWaitUntil:
    visible:
      id: account.signOut
    timeout: 15000
- tapOn:
    id: account.signOut
- tapOn:
    text: Cerrar sesión
- extendedWaitUntil:
    visible:
      id: auth.signedOut
    timeout: 30000
- assertNotVisible:
    id: nav.home
